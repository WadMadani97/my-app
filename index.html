<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; frame-src https://wad-madani-guide.firebaseapp.com https://www.google.com; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'self';">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>دليلك بود مدني</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d4f4f">
<link rel="icon" href="img/favicon.ico">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دليلك بود مدني">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{
  --nile:#0d4f4f;
  --nile-dark:#082f2f;
  --nile-tint:#e4f0ee;
  --ochre:#c98a2b;
  --ochre-dark:#a06e1f;
  --brick:#a6402b;
  --cream:#faf6ed;
  --ink:#20302c;
  --ink-soft:#4b5a55;
  --line:#e4ddc9;
  --card:#ffffff;
  --radius:16px;
  --shadow:0 6px 20px rgba(13,79,79,.08);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;font-family:'Tajawal',sans-serif;background:var(--cream);color:var(--ink);
  min-height:100vh;padding-bottom:96px;
}
h1,h2,h3,.display{font-family:'Lalezar',sans-serif;font-weight:400;letter-spacing:.5px}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer}
img{max-width:100%;display:block}
::selection{background:var(--ochre);color:#fff}

/* header */
.site-header{
  background:linear-gradient(160deg,var(--nile) 0%,var(--nile-dark) 100%);
  color:#fff;padding:18px 16px 0;position:sticky;top:0;z-index:50;
  border:1.5px solid #000;border-radius:0 0 18px 18px;
  box-shadow:0 4px 16px rgba(0,0,0,.18);
}
.header-row{display:flex;align-items:center;justify-content:space-between;max-width:960px;margin:0 auto;gap:10px}
.logo{display:flex;align-items:center;gap:14px;font-size:26px;transition:.2s}
.logo:hover{opacity:.9}
/* يمنع قائمة السياق الافتراضية (نسخ الرابط/فتح الصورة/حفظ الصورة...) وتحديد النص والسحب على
   اللوجو، لأنه يستخدم كزر ضغطة مطوّلة لفتح لوحة التحكم، ويجب ألا يتصرف كرابط/صورة عاديين
   عند الضغط المطوّل عليه في المتصفحات (خصوصاً على الموبايل). */
.logo, .logo img{
  -webkit-touch-callout:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
  -webkit-user-drag:none;-khtml-user-drag:none;-moz-user-drag:none;-o-user-drag:none;user-drag:none;
}
.logo .badge{
  width:60px;height:60px;border-radius:50%;background:var(--ochre);display:flex;align-items:center;justify-content:center;
  font-family:'Lalezar',sans-serif;color:var(--nile-dark);font-size:30px;flex-shrink:0;
  box-shadow:0 4px 14px rgba(0,0,0,.22);overflow:hidden;border:2px solid rgba(255,255,255,.35);
}
.logo .badge img{width:100%;height:100%;object-fit:cover;display:block}
.logo .display{font-size:clamp(24px,4.4vw,34px);letter-spacing:.5px}
.header-links{display:flex;gap:6px;font-size:15px}
.header-links a{padding:10px 20px;border-radius:24px;opacity:.9;transition:.2s;font-weight:700;border:1px solid rgba(255,255,255,.25)}
.header-links a:hover,.header-links a.active{background:rgba(255,255,255,.18);opacity:1;border-color:rgba(255,255,255,.4)}
.install-btn{
  padding:10px 18px;border-radius:24px;font-weight:700;font-size:14px;cursor:pointer;
  background:var(--ochre);color:var(--nile-dark);border:1px solid rgba(255,255,255,.4);
  display:inline-flex;align-items:center;gap:6px;transition:.2s;font-family:inherit;
}
.install-btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
/* يمنع تحديد/نسخ النص وقائمة السياق الافتراضية (نسخ الرابط/فتح الصورة/حفظ الصورة) داخل صفحات
   القسم وصفحة تفاصيل المنشأة، على الديسكتوب والموبايل معاً (رادع بسيط، لا يمنع لقطة الشاشة تقنياً) */
.no-copy{
  -webkit-touch-callout:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
}
.no-copy img{-webkit-user-drag:none;-khtml-user-drag:none;-moz-user-drag:none;-o-user-drag:none;user-drag:none;pointer-events:auto}
.no-copy a{-webkit-touch-callout:none}
.back-btn{
  padding:10px 16px;border-radius:24px;font-weight:700;font-size:14px;cursor:pointer;
  background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.4);
  display:inline-flex;align-items:center;gap:6px;transition:.2s;font-family:inherit;
}
.back-btn:hover{background:rgba(255,255,255,.24)}
html.lang-en .back-btn .back-arrow{display:inline-block;transform:scaleX(-1)}
.ios-install-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;
  z-index:9999;padding:20px;
}
.ios-install-card{
  background:#fff;border-radius:16px;padding:24px;max-width:360px;width:100%;text-align:right;
  box-shadow:0 12px 40px rgba(0,0,0,.3);
}
.ios-install-card h3{margin:0 0 14px;color:var(--nile)}
.ios-install-card ol{margin:0 0 18px;padding-inline-start:20px;line-height:2}
.river{height:14px;max-width:960px;margin:12px auto 0;opacity:.55}

/* hero + search */
.hero{max-width:960px;margin:0 auto;padding:0}
.hero p{color:var(--ink-soft);margin:0 0 18px;font-size:15px}
.hero-tagline{
  font-family:'Tajawal',sans-serif;font-weight:600;font-size:clamp(15px,2.4vw,18px);
  color:var(--ink);
  max-width:620px;margin:0 auto 22px;line-height:1.9;letter-spacing:.15px;
  background:linear-gradient(180deg,#ffffff 0%,var(--nile-tint) 100%);
  border:1.5px solid var(--nile);border-radius:16px;
  padding:20px 26px;box-shadow:0 8px 22px rgba(13,79,79,.12);
  position:relative;
}
.hero-tagline::before{
  content:'';position:absolute;top:-1.5px;right:24px;width:46px;height:4px;border-radius:0 0 4px 4px;
  background:var(--ochre);
}
.hero-wa-btn{
  display:inline-flex;align-items:center;gap:8px;margin-top:16px;background:#25D366;color:#fff;
  padding:12px 22px;border-radius:30px;font-weight:800;font-size:14.5px;box-shadow:0 6px 16px rgba(37,211,102,.35);
}
.wa-header-btn{background:#25D366;color:#fff!important;padding:7px 12px;border-radius:20px;font-weight:700;opacity:1!important}
.search-wrap{position:relative;max-width:520px;margin:0 auto}
.search-wrap input{
  width:100%;padding:14px 46px 14px 16px;border-radius:30px;border:1px solid var(--line);
  font-size:15px;font-family:inherit;background:#fff;box-shadow:var(--shadow);
}
.search-wrap input:focus{outline:2px solid var(--ochre);outline-offset:1px}
.search-wrap .icon{position:absolute;right:16px;top:50%;transform:translateY(-50%);opacity:.5}
.search-results{max-width:520px;margin:8px auto 0;background:#fff;border-radius:14px;box-shadow:var(--shadow);overflow:hidden;text-align:right}
.search-results .sr-item{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.search-results .sr-item:last-child{border:0}
.search-results .sr-item:hover{background:var(--nile-tint)}
.sr-empty{padding:14px;color:var(--ink-soft);font-size:14px}

/* container */
.container{max-width:960px;margin:0 auto;padding:0 16px 60px}

/* category grid */
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
/* بطاقة موحّدة الحجم للأقسام والمميزة (نفس الأبعاد والحواف والتنسيق) */
.cat-card{
  background:#fff;border-radius:10px;padding:8px 6px;text-align:center;box-shadow:var(--shadow);
  border:1.5px solid var(--nile-dark);transition:.2s;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:94px;min-width:0;overflow:hidden;
}
.cat-card:hover{transform:translateY(-3px);border-color:var(--ochre)}
.cat-card .emoji{font-size:22px;display:block;margin-bottom:2px}
.cat-card .name{font-weight:700;font-size:12.5px;width:100%;line-height:1.35;max-height:2.7em;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cat-card .count{color:var(--ink-soft);font-weight:600;font-size:10.5px;margin-top:1px}

.section-title{display:flex;align-items:center;gap:10px;margin:36px 0 14px}
/* أول عنوان بعد الهيدر مباشرة: مسافة صغيرة (الأقسام قريبة من الهيدر) */
.container > .section-title:first-child{margin-top:14px}
.section-title h2{font-size:22px;margin:0;color:var(--nile)}
.section-title .rule{flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--ochre) 0 8px, transparent 8px 14px)}

/* featured — نفس شبكة وحجم وحواف بطاقات الأقسام */
.feat-scroll{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.feat-card{
  background:#fff;border-radius:10px;padding:8px 6px;text-align:center;box-shadow:var(--shadow);
  border:1.5px solid var(--nile-dark);transition:.2s;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:94px;min-width:0;overflow:hidden;
}
.feat-card:hover{transform:translateY(-3px);border-color:var(--ochre)}
.feat-card .emoji{font-size:22px;display:block;margin-bottom:2px}
.feat-card .name{font-weight:700;font-size:12.5px;width:100%;line-height:1.35;max-height:2.7em;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.feat-card .count{color:var(--ink-soft);font-weight:600;font-size:10.5px;margin-top:1px;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* biz grid */
.biz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-top:6px}
.biz-card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column}
.biz-card .thumb{height:140px;background:var(--nile-tint) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:38px;color:var(--nile);position:relative}
.biz-card .thumb .star{position:absolute;top:8px;left:8px;background:var(--ochre);color:#fff;font-size:11px;padding:3px 8px;border-radius:10px}
.biz-card .body{padding:12px 14px;flex:1;display:flex;flex-direction:column;gap:6px}
.biz-card .name{font-weight:700;font-size:16px}
.biz-card .tag{color:var(--ochre-dark);font-size:12.5px;font-weight:700}
.biz-card .desc{color:var(--ink);font-weight:500;font-size:13px;line-height:1.6;flex:1}
.biz-card .foot{display:flex;gap:8px;margin-top:6px}
.pill-btn{
  flex:1;text-align:center;padding:8px 6px;border-radius:10px;font-size:13px;font-weight:700;border:none;
  background:var(--nile);color:#fff;
}
.pill-btn.ghost{background:var(--nile-tint);color:var(--nile)}

/* empty state */
.empty{text-align:center;padding:50px 20px;color:var(--ink-soft)}
.empty .emoji{font-size:44px;display:block;margin-bottom:10px}

/* breadcrumb */
.crumbs{font-size:13px;color:var(--ink-soft);margin:16px 0}
.crumbs a{color:var(--nile);font-weight:700}

/* filters row */
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.chip{padding:7px 14px;border-radius:20px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--ink-soft)}
.chip.active{background:var(--nile);color:#fff;border-color:var(--nile)}

/* business detail */
.gallery{border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);margin-top:10px}
.gallery .main{height:260px;background:var(--nile-tint) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:60px;color:var(--nile)}
.gallery-thumbs{display:flex;gap:8px;margin-top:8px;overflow-x:auto}
.gallery-thumbs img{width:70px;height:56px;object-fit:cover;border-radius:8px;border:2px solid transparent;cursor:pointer}
.gallery-thumbs img.active{border-color:var(--ochre)}

.biz-title-row{display:flex;justify-content:space-between;align-items:flex-start;margin-top:18px;gap:10px}
.biz-title-row h1{margin:0;font-size:26px;color:var(--ink)}
.badge-24{background:var(--brick);color:#fff;font-size:12px;padding:4px 10px;border-radius:10px;white-space:nowrap}
.biz-meta{color:var(--ink);font-weight:500;font-size:14px;margin:6px 0 14px;line-height:1.8}
.info-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.info-card h3{margin:0 0 8px;font-size:16px;color:var(--nile)}
.info-card p{margin:0;line-height:1.9;font-size:14.5px;color:var(--ink)}
.phones-list{display:flex;flex-direction:column;gap:8px}
.phone-row{display:flex;align-items:center;justify-content:space-between;background:var(--nile-tint);border-radius:10px;padding:9px 12px}
.action-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;position:sticky;bottom:96px;background:var(--cream);padding:10px 0;border-top:1px solid var(--line);margin-top:20px}
.action-bar a{
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px;border-radius:12px;font-size:12px;font-weight:700;
  background:#fff;border:1px solid var(--line);color:var(--ink);
}
.action-bar a span.ic{font-size:18px}
.action-bar a.whatsapp{background:#25D366;color:#fff;border-color:#25D366}
.action-bar a.call{background:var(--nile);color:#fff;border-color:var(--nile)}
.map-embed{width:100%;height:220px;border:0;border-radius:14px;margin-top:6px}

/* footer */
.site-footer{background:var(--nile-dark);color:#cfe4e0;text-align:center;padding:26px 16px;margin-top:40px;font-size:13px}
.site-footer a{color:#fff;font-weight:700}

/* admin */
.admin-shell{max-width:960px;margin:0 auto;padding:20px 16px 60px}
.admin-login{max-width:360px;margin:60px auto;background:#fff;border-radius:16px;padding:26px;box-shadow:var(--shadow);text-align:center}
.admin-login h2{color:var(--nile);margin-top:0}
.field{margin-bottom:14px;text-align:right}
.field label{display:block;font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:5px}
.field input[type=text],.field input[type=password],.field input[type=number],.field input[type=url],.field textarea,.field select{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:14px;background:#fff;
}
.field textarea{min-height:80px;resize:vertical}
.btn{background:var(--nile);color:#fff;border:none;padding:11px 20px;border-radius:10px;font-weight:700;font-size:14px}
.btn.secondary{background:#fff;color:var(--nile);border:1px solid var(--nile)}
.btn.danger{background:var(--brick);color:#fff}
.btn.small{padding:6px 12px;font-size:12.5px}
.btn:disabled{opacity:.5}
.admin-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.admin-tabs{display:flex;gap:8px;flex-wrap:wrap}
.admin-tabs button{padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:13.5px;color:var(--ink-soft)}
.admin-tabs button.active{background:var(--nile);color:#fff;border-color:var(--nile)}
.admin-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.admin-list-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.admin-list-row:last-child{border:0}
.row-info{display:flex;align-items:center;gap:10px}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.status-dot{width:9px;height:9px;border-radius:50%;background:#999;display:inline-block}
.status-dot.on{background:#2ea56b}
.tag-mini{background:var(--nile-tint);color:var(--nile);font-size:11px;padding:2px 8px;border-radius:8px;font-weight:700}
.tag-mini.featured{background:#fff2dd;color:var(--ochre-dark)}
.phone-input-row{display:flex;gap:6px;margin-bottom:8px}
.phone-input-row input{flex:1}
.icon-btn{background:none;border:1px solid var(--line);border-radius:8px;width:34px;height:34px;font-size:16px;color:var(--brick)}
.img-thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.img-thumb{position:relative;width:80px;height:64px}
.img-thumb img{width:100%;height:100%;object-fit:cover;border-radius:8px;border:2px solid var(--line)}
.img-thumb.primary img{border-color:var(--ochre)}
.img-thumb .del{position:absolute;top:-6px;left:-6px;background:var(--brick);color:#fff;border-radius:50%;width:20px;height:20px;font-size:12px;border:none;line-height:20px}
.img-thumb .mk{position:absolute;bottom:-6px;right:-6px;background:var(--ochre);color:#fff;border-radius:8px;width:20px;height:20px;font-size:11px;border:none;line-height:20px}
.upload-box{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--ink-soft);font-size:13px;cursor:pointer}
.toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:30px;font-size:13.5px;z-index:200;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.hint{font-size:12px;color:var(--ink-soft);margin-top:4px}
.emoji-picker{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.emoji-picker button{font-size:20px;background:#fff;border:1px solid var(--line);border-radius:8px;width:38px;height:38px}
.emoji-picker button.active{border-color:var(--ochre);background:var(--nile-tint)}
.security-note{background:#fff2dd;border:1px solid #eecf9a;color:#7a5715;font-size:12.5px;padding:10px 12px;border-radius:10px;margin-bottom:16px}
@media (min-width:900px){
  .container, .admin-shell, .header-row, .hero, .action-bar.container{max-width:1080px}
  .cat-grid,.feat-scroll{grid-template-columns:repeat(3,1fr)}
  .biz-grid{grid-template-columns:repeat(3,1fr)}
}
@media (min-width:1200px){
  .container, .admin-shell, .header-row, .hero{max-width:1180px}
  .biz-grid{grid-template-columns:repeat(4,1fr)}
}
@media (max-width:600px){
  .biz-title-row h1{font-size:21px}
  .action-bar{grid-template-columns:repeat(4,1fr)}
  .header-links{font-size:12.5px;gap:4px}
  .wa-header-btn{padding:6px 9px;font-size:12px}
  .install-btn{padding:6px 10px;font-size:11.5px;gap:4px}
  .logo .badge{width:48px;height:48px;font-size:22px}
  .logo .display{font-size:20px}
  .hero-tagline{padding:16px 18px;border-radius:14px}
}

/* bottom nav bar */
.bottom-nav{
  position:fixed;right:0;left:0;bottom:0;z-index:70;
  display:flex;justify-content:space-around;align-items:stretch;gap:6px;
  background:linear-gradient(160deg,var(--nile) 0%,var(--nile-dark) 100%);
  border:1.5px solid #000;border-radius:18px 18px 0 0;
  box-shadow:0 -6px 18px rgba(13,79,79,.10);
  min-height:88px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0));
}
.bottom-nav a{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  padding:10px 4px;font-size:13px;font-weight:700;color:#fff;transition:.15s;
  border:1px solid rgba(0,0,0,.35);border-radius:14px;
}
.bottom-nav a:hover{border-color:#000;background:rgba(255,255,255,.08)}
.bottom-nav a .bn-ic{font-size:25px;line-height:1;margin-bottom:3px}
.bottom-nav a.active{color:#fff;border-color:#000;background:rgba(0,0,0,.14)}
.bottom-nav a.contact{color:#fff}
.bottom-nav a.more{color:#fff}

<!-- Firebase (قاعدة بيانات سحابية مجانية - بدون بطاقة ائتمانية) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>

<script>
/* ============ STORAGE HELPERS ============
   ترتيب الأولوية تلقائياً:
   1) Firestore (Firebase): إن نجح الاتصال، تُحفظ كل البيانات سحابياً ويراها
      كل زائر من أي جهاز أو متصفح - هذا هو المطلوب لموقع حقيقي.
   2) window.storage: يعمل فقط داخل معاينة Claude.
   3) localStorage: كحل احتياطي أخير على نفس الجهاز فقط، لو تعذر الاتصال بالإنترنت.
*/
const firebaseConfig = {
  apiKey: "AIzaSyAk_pzydWm4kgtMXh0vtyJaNgVAKzMfTZE",
  authDomain: "wad-madani-guide.firebaseapp.com",
  projectId: "wad-madani-guide",
  storageBucket: "wad-madani-guide.firebasestorage.app",
  messagingSenderId: "277806653493",
  appId: "1:277806653493:web:4298488d7056b35f80517c"
};

let HAS_FIRESTORE = false;
let HAS_AUTH = false;
let db = null;
let auth = null;
try{
  if(typeof firebase !== 'undefined'){
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    HAS_FIRESTORE = true;
    auth = firebase.auth();
    HAS_AUTH = true;
  }
}catch(e){ console.error('Firebase init failed', e); }

const HAS_CLAUDE_STORAGE = (typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function');
const LS_PREFIX = 'wadmadani:';

function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(()=> reject(new Error('timeout')), ms))
  ]);
}

async function sGet(key){
  if(HAS_FIRESTORE){
    try{
      const doc = await withTimeout(db.collection('kv').doc(key).get(), 6000);
      return doc.exists ? JSON.parse(doc.data().value) : null;
    }catch(e){ console.error('firestore get failed/timeout', e); /* fall through to backups below */ }
  }
  if(HAS_CLAUDE_STORAGE){
    try{ const r = await window.storage.get(key, true); return r ? JSON.parse(r.value) : null; }
    catch(e){ return null; }
  }
  try{
    const raw = localStorage.getItem(LS_PREFIX + key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
async function sSet(key, value){
  if(HAS_FIRESTORE){
    try{
      await withTimeout(db.collection('kv').doc(key).set({value: JSON.stringify(value), updatedAt: Date.now()}), 8000);
      return true;
    }catch(e){
      console.error('firestore set failed/timeout', e);
      toast('تعذر الحفظ سحابياً، تحقق من الإنترنت أو حجم الصور');
      return false;
    }
  }
  if(HAS_CLAUDE_STORAGE){
    try{ await window.storage.set(key, JSON.stringify(value), true); return true; }
    catch(e){ console.error('storage set failed', e); return false; }
  }
  try{
    localStorage.setItem(LS_PREFIX + key, JSON.stringify(value));
    return true;
  }catch(e){ console.error('localStorage set failed', e); return false; }
}
async function sDelete(key){
  // يُرجع true/false حسب نجاح الحذف الفعلي، كي تقدر عمليات الحذف بالجملة (مثل حذف قسم كامل)
  // تتوقف عند أول فشل بدل المتابعة على بيانات غير متسقة (منشآت محذوفة جزئياً)
  if(HAS_FIRESTORE){
    try{ await withTimeout(db.collection('kv').doc(key).delete(), 6000); return true; }
    catch(e){ console.error(e); return false; }
  }
  if(HAS_CLAUDE_STORAGE){
    try{ await window.storage.delete(key, true); return true; }
    catch(e){ return false; }
  }
  try{ localStorage.removeItem(LS_PREFIX + key); return true; }
  catch(e){ return false; }
}

function uid(){ return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
// يؤخر تنفيذ الدالة حتى يتوقف المستخدم عن الكتابة لمدة `wait` مللي ثانية — يمنع إعادة
// رسم نتائج البحث بالكامل مع كل ضغطة زر، خصوصاً مع فهرس منشآت كبير
function debounce(fn, wait=200){
  let t;
  return function(...args){ clearTimeout(t); t = setTimeout(()=>fn.apply(this,args), wait); };
}
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// يسمح فقط بروابط http/https الآمنة، ويمنع روابط javascript:/data: التي قد تُستخدم لهجمات XSS
function safeUrl(u){
  const s = (u||'').toString().trim();
  if(!/^https?:\/\//i.test(s)) return '';
  try{
    const parsed = new URL(s);
    if((parsed.protocol === 'http:' || parsed.protocol === 'https:') && parsed.hostname) return esc(s);
  }catch(e){}
  return '';
}
// يسمح فقط بأرقام عشرية (لخطوط الطول/العرض) لمنع الحقن داخل src الخاص بالخريطة
function safeCoord(v, kind='lng'){
  const s = (v||'').toString().trim();
  if(!/^-?(?:\d{1,3})(?:\.\d+)?$/.test(s)) return '';
  const n = Number(s);
  const limit = kind === 'lat' ? 90 : 180;
  return Number.isFinite(n) && n >= -limit && n <= limit ? s : '';
}
// يسمح فقط بصور Base64 (data:image/...) أو روابط https الآمنة، ويمنع أي حقن عبر style/src
// (data:text/html أو javascript: تُرفض، حتى لو وصلت من مصدر غير متوقع كـ Firestore)
function safeImageUrl(u){
  const s = (u||'').toString().trim();
  if(!s) return '';
  if(/^data:image\/(png|jpe?g|webp|gif);base64,[a-zA-Z0-9+/=]+$/.test(s)) return s;
  if(!/^https:\/\//i.test(s)) return '';
  try{
    const parsed = new URL(s);
    if(parsed.protocol === 'https:' && parsed.hostname) return esc(s);
  }catch(e){}
  return '';
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._h); toast._h = setTimeout(()=> t.classList.remove('show'), 2200);
}
function phoneDigits(p){ return (p||'').replace(/[^\d]/g,''); }

function telLink(p){ return 'tel:' + phoneDigits(p); }
const WA_BUSINESS_LINK = 'https://wa.me/249127985731?text=' + encodeURIComponent('مرحباً، أرغب في إضافة نشاطي/خدمتي في دليلك بود مدني');

/* ============ SEED DATA ============ */
const DEFAULT_SECTIONS = [
  {id:'sec-rest', name:'المطاعم', icon:'🍽️', type:'restaurant', order:1, active:true},
  {id:'sec-hotel', name:'الفنادق والشقق الفندقية', icon:'🏨', type:'hotel', order:2, active:true},
  {id:'sec-doctor', name:'الأطباء والأخصائيون', icon:'👨‍⚕️', type:'doctor', order:3, active:true},

];

const TYPE_FIELDS = {
  restaurant: [
    {key:'priceRange', label:'الفئة السعرية (اختياري)', type:'text', ph:'مثال: اقتصادي / متوسط / راقي'},
    {key:'menu', label:'قائمة الأسعار / المنيو', type:'textarea', ph:'اكتب الأصناف والأسعار، صنف في كل سطر'},
  ],
  hotel: [
    {key:'roomTypes', label:'أنواع الغرف', type:'textarea', ph:'مفردة، مزدوجة، جناح...'},
    {key:'prices', label:'الأسعار (اختياري)', type:'textarea', ph:'سعر كل نوع غرفة لليلة'},
    {key:'amenities', label:'الخدمات والمميزات', type:'textarea', ph:'واي فاي، مواقف، إفطار، مسبح...'},
  ],
  doctor: [
    {key:'specialty', label:'التخصص', type:'text', ph:'مثال: باطنية، أطفال، أسنان'},
    {key:'clinicTitle', label:'اسم/عنوان العيادة', type:'text', ph:''},
    {key:'license', label:'رقم التسجيل المهني (اختياري)', type:'text', ph:''},
  ],
  pharmacy: [
    {key:'is24h', label:'تعمل 24 ساعة', type:'checkbox'},
  ],
  hospital: [
    {key:'departments', label:'الأقسام والخدمات', type:'textarea', ph:'الطوارئ، الباطنية، الأشعة...'},
  ],
  custom: [],
};

async function ensureSeed(){
  let sections = await sGet('sections');
  if(!sections){
    sections = DEFAULT_SECTIONS;
    await sSet('sections', sections);
  }
  let index = await sGet('businesses-index');
  if(!index){
    index = [];
    await sSet('businesses-index', index);
  }
}

/* ============ STATE ============ */
const state = { sections: [], index: [], isAdmin: false, unverifiedUser: null };

async function loadState(){
  state.sections = (await sGet('sections')) || [];
  state.index = (await sGet('businesses-index')) || [];
}
async function saveSections(){ return await sSet('sections', state.sections); }
async function saveIndex(){ return await sSet('businesses-index', state.index); }
async function loadBiz(id){
  // تخزين مؤقت في الذاكرة: إن فُتحت نفس المنشأة سابقاً في هذه الجلسة، لا داعي
  // لطلب Firestore مرة أخرى (يُحدَّث تلقائياً عند أي تعديل عبر saveBiz/deleteBiz)
  if(state.bizCache && state.bizCache[id]) return state.bizCache[id];
  const biz = await sGet('biz:'+id);
  if(!state.bizCache) state.bizCache = {};
  if(biz) state.bizCache[id] = biz;
  return biz;
}
async function saveBiz(biz){
  // يُرجع true/false حسب نجاح الحفظ الفعلي في Firestore، كي تقدر الشاشة المستدعية تعرض
  // رسالة خطأ صحيحة بدل افتراض النجاح دائماً
  const ok = await sSet('biz:'+biz.id, biz);
  if(!ok) return false;
  if(!state.bizCache) state.bizCache = {};
  state.bizCache[biz.id] = biz; // تحديث التخزين المؤقت فوراً بعد الحفظ
  const i = state.index.findIndex(b=>b.id===biz.id);
  const light = {id:biz.id, sectionId:biz.sectionId, name:biz.name, category:biz.category||'',
    image: (biz.images&&biz.images[biz.primaryImageIndex||0]) || '', active:biz.active!==false, featured:!!biz.featured,
    phone: (biz.phones&&biz.phones[0])||'', desc:biz.description||''};
  if(i>=0) state.index[i] = light; else state.index.push(light);
  await saveIndex();
  return true;
}
async function deleteBiz(id){
  const ok = await sDelete('biz:'+id);
  if(!ok) return false; // فشل الحذف الفعلي من Firestore: لا نلمس الفهرس المحلي كي لا يفقد تزامنه
  if(state.bizCache) delete state.bizCache[id]; // إزالة من التخزين المؤقت بعد الحذف
  state.index = state.index.filter(b=>b.id!==id);
  await saveIndex();
  return true;
}

/* ============ IMAGE RESIZE ============ */
function resizeImage(file, maxDim=640, quality=0.55){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = h*maxDim/w; w = maxDim; }
        else if(h > maxDim){ w = w*maxDim/h; h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', () => {
  // نُبقي شاشة الترحيب ظاهرة حتى تجهز كل الأقسام الحقيقية، بدل عرض الأقسام
  // الافتراضية فوراً ثم ظهور الباقي متأخراً بعد تحديث الصفحة — هكذا تظهر
  // كل الأقسام دفعة واحدة عند أول عرض للصفحة الرئيسية.
  state.sections = DEFAULT_SECTIONS.slice();
  state.index = [];
  state.isAdmin = false;
  (async function bootstrap(){
    try{
      await ensureSeed();
      await loadState();
    }catch(e){ console.error('bootstrap failed', e); }
    const splash = document.getElementById('initial-splash');
    if(splash) splash.remove();
    render();
    try{
      if(HAS_AUTH){
        try{ await auth.setPersistence(firebase.auth.Auth.Persistence.SESSION); }
        catch(e){ console.error('setPersistence failed', e); }
        let resolved = false;
        auth.onAuthStateChanged(user => {
          resolved = true;
          // الدخول لا يُعتبر مكتملاً إلا إذا كان البريد "مُحقَّقاً" (emailVerified) *و* تم تأكيد
          // ذلك التحقق خلال هذه الجلسة تحديداً (wadmadani:sessionVerified في sessionStorage).
          // هذا يضمن طلب تحقق جديد في كل مرة يُفتح فيها الموقع من جديد، حتى لو كان
          // emailVerified محفوظاً بشكل دائم من قبل على مستوى حساب Firebase نفسه.
          const sessionVerified = sessionStorage.getItem('wadmadani:sessionVerified') === '1';
          state.isAdmin = !!user && user.emailVerified && sessionVerified;
          state.unverifiedUser = (user && !(user.emailVerified && sessionVerified)) ? user : null;
          render();
        });
        setTimeout(() => {
          if(!resolved){ console.warn('auth state timed out, showing site as guest'); render(); }
        }, 4000);
      } else {
        state.isAdmin = false;
        render();
      }
    }catch(e){ console.error('render failed', e); render(); }
  })();
});

// Route all internal links (href="#/...") through nav() so the page always
// re-renders immediately, instead of depending only on the browser's
// hashchange event (which can be unreliable inside a sandboxed preview).
document.addEventListener('click', (e) => {
  const back = e.target.closest('[data-action="back"]');
  if(back){ e.preventDefault(); goBack(); return; }
  const a = e.target.closest('a[href^="#/"]');
  if(!a) return;
  e.preventDefault();
  nav(a.getAttribute('href'));
});

// يمنع قائمة النقر بالزر الأيمن (نسخ/حفظ) فقط داخل صفحات القسم وصفحة تفاصيل المنشأة (.no-copy)
// ملاحظة: هذا رادع بسيط لتقليل النسخ العرضي فقط، ولا يمنع لقطة الشاشة تقنياً لأنها تتم على مستوى نظام التشغيل خارج سيطرة أي موقع ويب.
document.addEventListener('contextmenu', (e) => {
  if(e.target.closest('.no-copy')) e.preventDefault();
});

function nav(hash){
  if(location.hash === hash){ render(); return; }
  location.hash = hash;
  // Fallback in case hashchange doesn't fire for any reason
  setTimeout(() => { if(location.hash === hash) render(); }, 0);
}

async function render(){
  const app = document.getElementById('app');
  const hash = location.hash || '#/';
  setTimeout(applyLanguage, 0);
  // ملاحظة أداء: state.sections و state.index تم تحميلها مرة واحدة فقط عند فتح
  // الموقع (loadState في DOMContentLoaded) وتُحدَّث محلياً تلقائياً عند أي حفظ
  // من لوحة التحكم (saveSections/saveIndex) — لذلك لا داعي لإعادة قراءتها من
  // Firestore مع كل تنقل، وهذا كان سبب بطء الحركة الداخلية بالموقع.
  if(hash === '#/' ) return renderHome(app);
  if(hash.startsWith('#/section/')) return renderSectionPage(app, hash.split('/')[2]);
  if(hash.startsWith('#/biz/')) return renderBizPage(app, hash.split('/')[2]);
  if(hash.startsWith('#/search')) return renderSearchPage(app);
  if(hash.startsWith('#/featured')) return renderFeaturedPage(app);
  if(hash.startsWith('#/admin')) return renderAdmin(app, hash);
  renderHome(app);
}

function translateText(value){
  if(currentLanguage === 'ar' || !value) return value;
  let out = value;
  Object.keys(UI_TRANSLATIONS).sort((a,b)=>b.length-a.length).forEach(ar => { out = out.split(ar).join(UI_TRANSLATIONS[ar]); });
  out = out.replace(/(\d+)\s*منشأة/g,'$1 businesses').replace(/(\d+)\s*نتيجة/g,'$1 results');
  return out;
}
function applyLanguage(){
  document.documentElement.lang = currentLanguage === 'en' ? 'en' : 'ar';
  document.documentElement.dir = currentLanguage === 'en' ? 'ltr' : 'rtl';
  document.documentElement.classList.toggle('lang-en', currentLanguage === 'en');
  document.title = currentLanguage === 'en' ? 'Wad Madani Guide' : 'دليلك بود مدني';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = translateText(el.getAttribute('data-i18n')); });
  const aboutContent = document.getElementById('aboutContent');
  if(aboutContent && document.getElementById('aboutBackdrop')?.classList.contains('open')) aboutContent.textContent = currentLanguage === 'en' ? ABOUT_EN : ABOUT_AR;
  const privacyContent = document.getElementById('privacyContent');
  if(privacyContent && document.getElementById('privacyBackdrop')?.classList.contains('open')) privacyContent.textContent = currentLanguage === 'en' ? PRIVACY_EN : PRIVACY_AR;
  const root = document.getElementById('app');
  if(!root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node => { if(node.parentElement && !/^(SCRIPT|STYLE|INPUT|TEXTAREA)$/i.test(node.parentElement.tagName)) node.nodeValue = translateText(node.nodeValue); });
  root.querySelectorAll('input[placeholder],textarea[placeholder]').forEach(el => { el.placeholder = translateText(el.placeholder); });
}
function setLanguage(lang){
  currentLanguage = lang === 'en' ? 'en' : 'ar';
  localStorage.setItem('wadmadani:language', currentLanguage);
  applyLanguage();
  render();
}

function isAppStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function maybeShowAutoInstallPopup(){
  if(isAppStandalone()) return; // مثبّت بالفعل، لا داعي للنافذة
  if(sessionStorage.getItem('installPopupShown')) return; // ظهرت مسبقاً في هذه الجلسة
  if(document.getElementById('autoInstallOverlay')) return; // ظاهرة بالفعل
  sessionStorage.setItem('installPopupShown', '1');

  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const overlay = document.createElement('div');
  overlay.id = 'autoInstallOverlay';
  overlay.className = 'ios-install-overlay';
  overlay.innerHTML = `
    <div class="ios-install-card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
        <img src="img/icon-192.png" alt="دليلك بود مدني" style="width:44px;height:44px;border-radius:12px">
        <h3 style="margin:0">ثبّت تطبيق دليلك بود مدني</h3>
      </div>
      <p style="margin:0 0 16px;line-height:1.8;color:#444">ثبّت التطبيق على شاشتك الرئيسية للوصول السريع بدون فتح المتصفح في كل مرة.</p>
      <div style="display:flex;gap:10px">
        <button class="btn" id="autoInstallLater" style="flex:1;background:#eee;color:#333">لاحقاً</button>
        <button class="btn" id="autoInstallNow" style="flex:1">📲 تثبيت الآن</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  document.getElementById('autoInstallLater').addEventListener('click', ()=> overlay.remove());
  overlay.addEventListener('click', e=>{ if(e.target === overlay) overlay.remove(); });
  document.getElementById('autoInstallNow').addEventListener('click', async ()=>{
    if(isIOS){ overlay.remove(); showIOSInstallHelp(); return; }
    if(!window.deferredInstallPrompt){ overlay.remove(); toast('التثبيت غير متاح حالياً في هذا المتصفح'); return; }
    window.deferredInstallPrompt.prompt();
    const choice = await window.deferredInstallPrompt.userChoice;
    if(choice.outcome === 'accepted') toast('تم تثبيت التطبيق بنجاح 🎉');
    window.deferredInstallPrompt = null;
    overlay.remove();
  });
}

function setupInstallButton(btn){
  if(!btn || btn.dataset.bound) return;
  btn.dataset.bound = '1';
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if(isStandalone) return; // مثبّت بالفعل
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if(isIOS){
    btn.style.display = 'inline-flex';
    btn.addEventListener('click', showIOSInstallHelp);
    return;
  }
  if(window.deferredInstallPrompt) btn.style.display = 'inline-flex';
  btn.addEventListener('click', async ()=>{
    if(!window.deferredInstallPrompt){ toast('التثبيت غير متاح حالياً في هذا المتصفح'); return; }
    window.deferredInstallPrompt.prompt();
    const choice = await window.deferredInstallPrompt.userChoice;
    if(choice.outcome === 'accepted') toast('تم تثبيت التطبيق بنجاح 🎉');
    window.deferredInstallPrompt = null;
    btn.style.display = 'none';
  });
}

function searchIndex(q){
  q = String(q||'').toLowerCase();
  return state.index.filter(b => b && b.active && (
    String(b.name||'').toLowerCase().includes(q) ||
    String(b.category||'').toLowerCase().includes(q) ||
    String(sectionNameOf(b.sectionId)||'').toLowerCase().includes(q)

async function renderAdmin(app, hash){
  const logged = state.isAdmin;
  if(!logged){
    if(state.unverifiedUser) return renderAdminVerifyEmail(app);

  const parts = hash.split('/'); // #,admin,tab,arg

}

async function renderAdminLogin(app){
  app.innerHTML = `
    ${header(true, true)}
    <div class="admin-login">
      <h2>🔐 لوحة تحكم دليلك بود مدني</h2>
      <p class="hint" style="color:var(--brick);font-weight:700;font-size:14px">لا يمكنك الدخول، محمي خاص للإدارة فقط.</p>
      <div class="field"><label>البريد الإلكتروني</label><input type="email" id="loginEmail" autocomplete="username" maxlength=254 placeholder="admin@example.com"></div>
      <div class="field"><label>كلمة المرور</label><input type="password" id="loginPass" autocomplete="current-password" maxlength=128 placeholder="كلمة المرور"></div>
      <button class="btn" id="loginBtn" style="width:100%">دخول</button>
      ${!HAS_AUTH ? `<p class="hint" style="color:var(--brick);margin-top:14px">⚠️ تعذّر الاتصال بنظام الدخول الآمن حالياً. تحقق من الإنترنت وحاول مجدداً.</p>` : ''}
    </div>
    ${footer()}
  `;
  const doLogin = async () => {
    if(!HAS_AUTH) return toast('تعذّر الاتصال بنظام الدخول، تحقق من الإنترنت');
    const email = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPass').value;
    if(!email || !pass) return toast('أدخل البريد وكلمة المرور');
    try{
      const cred = await withTimeout(auth.signInWithEmailAndPassword(email, pass), 10000);
      // البريد وكلمة المرور صحيحان هنا فقط — لذلك تنبيه الدخول الناجح ورابط التحقق يُرسلان هنا مباشرة،
      // وليس عبر زر منفصل يقدر أي زائر الضغط عليه بدون معرفة كلمة المرور الصحيحة
      const user = cred.user;
      // نمسح علامة "تم التحقق في هذه الجلسة" في كل دخول جديد، ونطلب تحقق جديد دائماً —
      // حتى لو كان الحساب emailVerified=true من قبل — لضمان تحقق في كل عملية دخول.
      sessionStorage.removeItem('wadmadani:sessionVerified');
      // لا نُعيد إرسال رابط جديد لو كان قد أُرسل رابط خلال آخر 5 دقائق من *نفس هذا الجهاز/المتصفح*
      // (الرابط السابق لا يزال صالحاً، والمستخدم يقدر يفتحه ويتحقق به مباشرة) — هذا يمنع إزعاج
      // المستخدم بإيميلات متكررة عند محاولات دخول متتالية سريعة، ويحمي من الوصول لحد Firebase للإرسال.
      // أما من جهاز/متصفح جديد فمفيش أي أثر لإرسال سابق، فيُرسل رابط فوراً كالمعتاد.
      const lastSentRaw = sessionStorage.getItem('wadmadani:lastVerifySentAt');
      const lastSentAt = lastSentRaw ? parseInt(lastSentRaw, 10) : 0;
      const RESEND_GAP_MS = 5 * 60 * 1000; // 5 دقائق
      const recentlySent = lastSentAt && (Date.now() - lastSentAt) < RESEND_GAP_MS;
      if(!recentlySent){
        try{
          await user.sendEmailVerification();
          sessionStorage.setItem('wadmadani:lastVerifySentAt', String(Date.now()));
        }catch(e){
          console.error('sendEmailVerification failed', e);
          if(e && e.code === 'auth/too-many-requests'){
            toast('تم إرسال عدة روابط تحقق مؤخراً، الرجاء الانتظار قليلاً قبل المحاولة مجدداً');
          }
        }
      }
      state.unverifiedUser = user;
      state.isAdmin = false;
      toast(recentlySent ? 'لديك رابط تحقق أُرسل مسبقاً، تحقق من بريدك' : 'تم إرسال رابط تحقق إلى بريدك، افتحه لإكمال الدخول');
      nav('#/admin');
    }catch(e){
      console.error(e);
      const isTimeout = e && e.message === 'timeout';
      // لا نرسل البريد المدخل أو بيانات الجهاز إلى خدمة خارجية من المتصفح.
      if(!isTimeout) console.warn('Login failed');
      toast(isTimeout ? 'انتهت المهلة، تحقق من الإنترنت وحاول مجدداً' : 'البريد أو كلمة المرور غير صحيحة');
    }
  };
  document.getElementById('loginBtn').addEventListener('click', doLogin);
  document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}

/* ---- شاشة انتظار التحقق من البريد: تظهر فقط بعد نجاح البريد وكلمة المرور،
   وقبل منح أي صلاحية دخول فعلية للوحة التحكم ---- */
function renderAdminVerifyEmail(app){
  const user = state.unverifiedUser;
  const email = user && user.email ? user.email : '';
  app.innerHTML = `
    ${header(true, true)}
    <div class="admin-login">
      <h2>📩 تحقق من بريدك الإلكتروني</h2>
      <p class="hint" style="font-size:14.5px;line-height:1.9">
        أرسلنا رابط تحقق إلى <b>${esc(email)}</b>. افتح البريد واضغط الرابط لإكمال تسجيل الدخول للوحة التحكم،
        ثم عد هنا واضغط "لقد تحققت من بريدي".
      </p>
      <button class="btn" id="checkVerifiedBtn" style="width:100%;margin-bottom:10px">لقد تحققت من بريدي</button>
      <button class="btn secondary" id="resendVerifyBtn" style="width:100%;margin-bottom:10px">إعادة إرسال رابط التحقق</button>
      <button class="btn secondary" id="cancelVerifyBtn" style="width:100%">تسجيل الخروج والعودة لتسجيل الدخول</button>
    </div>
    ${footer()}
  `;
  const resendBtn = document.getElementById('resendVerifyBtn');
  let cooldown = 0;
  let cooldownTimer = null;
  function startCooldown(seconds){
    cooldown = seconds;
    resendBtn.disabled = true;
    resendBtn.textContent = `إعادة الإرسال متاحة بعد ${cooldown} ثانية`;
    clearInterval(cooldownTimer);
    cooldownTimer = setInterval(()=>{
      cooldown--;
      if(cooldown <= 0){
        clearInterval(cooldownTimer);
        resendBtn.disabled = false;
        resendBtn.textContent = 'إعادة إرسال رابط التحقق';
      }else{
        resendBtn.textContent = `إعادة الإرسال متاحة بعد ${cooldown} ثانية`;
      }
    }, 1000);
  }
  document.getElementById('checkVerifiedBtn').addEventListener('click', async ()=>{
    if(!user) return nav('#/admin');
    try{
      await withTimeout(user.reload(), 8000);
      if(user.emailVerified){
        sessionStorage.setItem('wadmadani:sessionVerified', '1');
        state.isAdmin = true;
        state.unverifiedUser = null;
        toast('تم التحقق، تم تسجيل الدخول بنجاح');
        nav('#/admin');
      }else{
        toast('لم يتم التحقق من البريد بعد');
      }
    }catch(e){
      console.error(e);
      toast('تعذّر التحقق الآن، حاول مجدداً');
    }
  });
  resendBtn.addEventListener('click', async ()=>{
    if(!user || resendBtn.disabled) return;
    try{
      await user.sendEmailVerification();
      sessionStorage.setItem('wadmadani:lastVerifySentAt', String(Date.now()));
      toast('تم إرسال رابط تحقق جديد');
      startCooldown(60);
    }catch(e){
      console.error(e);
      if(e && e.code === 'auth/too-many-requests'){
        toast('تم إرسال عدة روابط تحقق مؤخراً، الرجاء الانتظار قليلاً قبل المحاولة مجدداً');
        startCooldown(60);
      }else{
        toast('تعذّر إرسال الرابط، حاول لاحقاً');
      }
    }
  });
  document.getElementById('cancelVerifyBtn').addEventListener('click', async ()=>{
    if(HAS_AUTH){ try{ await auth.signOut(); }catch(e){ console.error(e); } }
    sessionStorage.removeItem('wadmadani:sessionVerified');
    state.isAdmin = false;
    state.unverifiedUser = null;
    nav('#/admin');
  });
  // نحسب الوقت الفعلي المتبقي على إعادة الإرسال بناءً على آخر إرسال حقيقي (وليس 60 ثانية ثابتة دائماً) —
  // فلو الدخول الحالي لم يُرسل رابطاً جديداً (لأنه ضمن الـ 5 دقائق من إرسال سابق)، يُحسب الوقت المتبقي
  // من ذلك الإرسال السابق بدل إعادة تعيين المؤقت من الصفر في كل مرة.
  const lastSentRaw2 = sessionStorage.getItem('wadmadani:lastVerifySentAt');
  const lastSentAt2 = lastSentRaw2 ? parseInt(lastSentRaw2, 10) : 0;
  const elapsedSec = lastSentAt2 ? Math.floor((Date.now() - lastSentAt2) / 1000) : 60;
  const remaining = Math.max(0, 60 - elapsedSec);
  if(remaining > 0) startCooldown(remaining);
}

    // نتوقف عند أول فشل بدل الاستمرار على بيانات غير متسقة (بعض المنشآت محذوفة من
    // Firestore وبعضها لا يزال موجوداً بينما القسم نفسه لم يُحذف بعد). القسم لا يُحذف
    // إلا بعد نجاح حذف كل منشآته فعلياً.
    for(const biz of toDelete){
      const ok = await deleteBiz(biz.id);
      if(!ok){
        toast('تعذّر حذف بعض المنشآت، تحقق من الإنترنت وحاول مجدداً. لم يُحذف القسم.');
        renderAdminSections(app);
        return;
      }
    }
    state.sections = state.sections.filter(s=>s.id!==secId);
    const secOk = await saveSections();
    if(!secOk){ toast('تم حذف المنشآت لكن تعذّر حذف القسم نفسه، حاول مجدداً'); renderAdminSections(app); return; }
    toast('تم حذف القسم'); renderAdminSections(app);
  }));
}
async function moveSection(id, dir){
  const secs = [...state.sections].sort((a,b)=>a.order-b.order);
  const idx = secs.findIndex(s=>s.id===id);
  const swapIdx = idx+dir;
  if(swapIdx<0 || swapIdx>=secs.length) return;
  const tmp = secs[idx].order; secs[idx].order = secs[swapIdx].order; secs[swapIdx].order = tmp;
  state.sections = secs;
  await saveSections();
  renderAdminSections(document.getElementById('app'));
}

          </div>
          <button type="button" class="btn secondary small" id="addPhoneBtn">+ إضافة رقم آخر</button>
        </div>

        <div class="field"><label>العنوان</label><input type="text" id="fAddress" maxlength="300" value="${esc(biz.address)}"></div>
        <div class="field"><label>رابط الموقع على خرائط جوجل</label><input type="url" id="fMapUrl" maxlength="2048" value="${esc(biz.mapUrl)}" placeholder="https://maps.google.com/..."></div>
        <div style="display:flex;gap:10px">
          <div class="field" style="flex:1"><label>خط العرض Lat (اختياري - لعرض خريطة مصغرة)</label><input type="text" id="fLat" value="${esc(biz.lat)}"></div>

        </div>
        <div class="field"><label>ساعات العمل</label><input type="text" id="fHours" maxlength="160" value="${esc(biz.workingHours)}" placeholder="مثال: يومياً 9ص - 12م"></div>

        ${fields.map(f=>{
          const v = biz.extra[f.key];
          if(f.type==='checkbox') return `<div class="field"><label><input type="checkbox" id="extra_${f.key}" ${v?'checked':''}> ${esc(f.label)}</label></div>`;
          if(f.type==='textarea') return `<div class="field"><label>${esc(f.label)}</label><textarea id="extra_${f.key}" placeholder="${esc(f.ph||'')}">${esc(v||'')}</textarea></div>`;

    </div>`).join('');
}
function bindImgThumbs(biz){

    bindImgThumbs(biz);

    biz.primaryImageIndex = +b.dataset.mki;

<!-- سكربت مستقل لتنبيه المستخدم عند انقطاع/عودة الاتصال بالإنترنت — لا يعدّل أي دالة أو منطق موجود مسبقاً بالموقع -->
<script>
(function(){
  function onOffline(){
    if(typeof toast === 'function'){
      toast(currentLanguage === 'en' ? 'No internet connection' : 'لا يوجد اتصال بالإنترنت');

  }
  function onOnline(){

      toast(currentLanguage === 'en' ? 'Back online' : 'تم استعادة الاتصال بالإنترنت');
    }
  }
  window.addEventListener('offline', onOffline);
  window.addEventListener('online', onOnline);

  window.addEventListener('load', function(){
    if(navigator.onLine === false) onOffline();
  });
})();

<!-- سكربت مستقل لتفعيل الشريط السفلي فقط — لا يعدّل أي دالة أو منطق موجود مسبقاً بالموقع -->
<script>
(function(){
  function activeTabFor(hash){
    hash = hash || '#/';
    if(hash.startsWith('#/search')) return 'search';
    if(hash.startsWith('#/featured')) return 'featured';
    if(hash === '#/') return 'home';
    return '';
  }
  function refreshBottomNav(){
    var tab = activeTabFor(location.hash);
    document.querySelectorAll('.bottom-nav a[data-tab]').forEach(function(a){
      a.classList.toggle('active', a.getAttribute('data-tab') === tab);
    });
  }
  window.addEventListener('hashchange', refreshBottomNav);
  window.addEventListener('DOMContentLoaded', refreshBottomNav);
  setTimeout(refreshBottomNav, 300);

  var moreBtn = document.getElementById('bnMore');
  var moreBackdrop = document.getElementById('moreMenuBackdrop');
  /* ===== مكدّس الشاشات الفرعية (المزيد / عن التطبيق / الخصوصية / أضف نشاطك) =====
     كل شاشة فرعية تُفتح تدفع خطوة جديدة في تاريخ المتصفح؛ هذا يجعل زر الرجوع
     الموجود بالهاتف يغلقها تلقائياً بنفس تصرف زر «رجوع» الظاهر على الشاشة،
     دون الحاجة لضغط الزر — كلاهما يؤديان نفس الإجراء بالضبط (goBack/history.back). */
  var overlayStack = [];
  function pushOverlay(name){
    overlayStack.push(name);
    history.pushState({mmOverlay:name}, '', location.href);
  }
  function closeMoreMenu(){ if(moreBackdrop){ moreBackdrop.classList.remove('open'); moreBackdrop.setAttribute('aria-hidden','true'); document.body.classList.remove('more-open'); } }
  function openMoreMenu(e, push){
    if(e) e.preventDefault();
    if(moreBackdrop){ moreBackdrop.classList.add('open'); moreBackdrop.setAttribute('aria-hidden','false'); document.body.classList.add('more-open'); applyLanguage(); }
    if(push !== false) pushOverlay('more');
  }
  function handleOverlayPop(){
    if(!overlayStack.length) return;
    var closed = overlayStack.pop();
    var parent = overlayStack[overlayStack.length - 1];
    if(closed === 'more') closeMoreMenu();
    else if(closed === 'about'){ closeAbout(); if(parent === 'more') openMoreMenu(null, false); }
    else if(closed === 'privacy'){ closePrivacy(); if(parent === 'more') openMoreMenu(null, false); }
    else if(closed === 'addbiz'){ closeAddBiz(); if(parent === 'more') openMoreMenu(null, false); }
    else if(closed === 'help'){ closeHelp(); if(parent === 'more') openMoreMenu(null, false); }
  }
  /* يغلق الشاشة الفرعية الحالية: يستخدم نفس مسار الرجوع الفعلي بالمتصفح
     (بالضبط كما يفعل زر رجوع الهاتف) حتى تتطابق كل مسارات الإغلاق. */
  function closeTopOverlay(){
    if(!overlayStack.length) return;
    if(window.history.length > 1) window.history.back();
    else handleOverlayPop();
  }

<!-- سكربت مستقل: ضغطة مطوّلة على اللوجو تفتح لوحة التحكم (#/admin) — مخفية تماماً عن الزوار،
     لا يوجد أي زر أو أيقونة ظاهرة لها. النقرة العادية على اللوجو تعمل كالمعتاد (رجوع للرئيسية).
     لا يعدّل أي دالة أو منطق موجود مسبقاً بالموقع. يستخدم event delegation على document
     كي يستمر بالعمل حتى بعد إعادة رسم الهيدر عند كل تنقل داخل الـ SPA.
     ملاحظة: touchstart هنا ليست passive عمداً كي نقدر نستدعي preventDefault ونمنع قائمة
     السياق الافتراضية للمتصفح (نسخ الرابط / فتح الصورة / حفظ الصورة) التي كانت تظهر بدل
     تفعيل الضغطة المطوّلة، خصوصاً على الموبايل حيث اللوجو رابط <a> يحتوي <img>. -->
<script>
(function(){
  var LONG_PRESS_MS = 700;
  var pressTimer = null;
  var triggered = false;
  function clearPress(){
    if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; }
  }
  function startPress(e){
    var logo = e.target.closest('#siteLogo');
    if(!logo) return;
    triggered = false;
    clearPress();
    pressTimer = setTimeout(function(){
      triggered = true;
      nav('#/admin');
    }, LONG_PRESS_MS);
  }
  function startPressTouch(e){
    var logo = e.target.closest('#siteLogo');
    if(!logo) return;
    // نمنع السلوك الافتراضي فوراً كي لا يظهر منيو "نسخ الرابط/فتح الصورة" أثناء الانتظار
    e.preventDefault();
    startPress(e);
  }
  function cancelPress(e){
    var logo = e.target.closest('#siteLogo');
    if(!logo){ clearPress(); return; }
    clearPress();
  }
  function suppressClickIfTriggered(e){
    var logo = e.target.closest('#siteLogo');
    if(!logo) return;
    if(triggered){
      e.preventDefault();
      triggered = false;
    }
  }
  function suppressContextMenu(e){
    var logo = e.target.closest('#siteLogo');
    if(logo) e.preventDefault();
  }
  document.addEventListener('mousedown', startPress);
  document.addEventListener('touchstart', startPressTouch, {passive:false});
  document.addEventListener('mouseup', cancelPress);
  document.addEventListener('mouseleave', cancelPress, true);
  document.addEventListener('touchend', cancelPress);
  document.addEventListener('touchcancel', cancelPress);
  document.addEventListener('click', suppressClickIfTriggered, true);
  document.addEventListener('contextmenu', suppressContextMenu);
})();
</script>

<!-- ملاحظة: منع قائمة السياق (نسخ/حفظ الصورة/فتح الرابط) على الديسكتوب مطبّق مسبقاً عبر
     مستمع contextmenu في السكربت الرئيسي أعلاه لعناصر .no-copy. على الموبايل، حيث لا يصل
     حدث contextmenu دائماً عند الضغط المطوّل، تولّت خاصية -webkit-touch-callout:none في
     تعريف .no-copy بملف الـ CSS منع ظهور تلك القائمة دون التأثير على التمرير أو الضغط العادي
     على الروابط والأزرار داخل هذه الصفحات (اتصال، خرائط جوجل، مشاركة...). -->
</body>
